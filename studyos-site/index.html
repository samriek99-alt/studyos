<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172554"><title>StudyOS</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#14213d;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#172554;color:white;padding:18px 24px}header h1{margin:0;font-size:1.6rem}header p{margin:5px 0 0;color:#dbeafe}.wrap{max-width:1050px;margin:auto;padding:20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;background:#1d4ed8;color:white;padding:10px 14px;cursor:pointer}button.secondary{background:#e2e8f0;color:#1e293b}button.active{background:#172554}.panel{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #0f172a08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.metric{font-size:1.6rem;font-weight:750;color:#1d4ed8}.muted{color:#64748b;font-size:.9rem}label{display:block;margin:8px 0;font-weight:600}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin-top:5px}textarea{min-height:65px}h2{margin-top:0}h3{margin-bottom:8px}.item{border-bottom:1px solid #e2e8f0;padding:12px 0}.item:last-child{border:0}.row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}.tag{display:inline-block;background:#e0e7ff;border-radius:100px;padding:3px 9px;font-size:.8rem}.hide{display:none}.notice{background:#fff7ed;border:1px solid #fed7aa;padding:12px;border-radius:10px;margin-bottom:15px}footer{text-align:center;color:#64748b;padding:20px}@media(max-width:600px){.wrap{padding:12px}.panel{padding:14px}}
</style></head><body><header><h1>StudyOS</h1><p>School + UCAT planning hub</p></header><main class="wrap"><div class="notice" id="status">Connecting to Supabase…</div><div class="panel" id="authPanel"><h2>Sign in to StudyOS</h2><p>Enter your email to receive a secure sign-in link.</p><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="email"></label><button type="submit">Email me a sign-in link</button></form><p id="authMessage" class="muted"></p></div><div class="panel hide" id="accountPanel"><div class="row"><span id="accountEmail"></span><button class="secondary" id="signOut">Sign out</button></div><p class="muted">Changes sync to Supabase. Avoid editing simultaneously on two devices.</p><button class="secondary" id="importLocal">Import older browser-only records (if any)</button></div><div id="privateApp" class="hide"><nav id="nav"></nav><div id="app"></div></div></main><footer>StudyOS · Cloud sync v2</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>
const sections=['Dashboard','UCAT Practice','Error Patterns','Homework','Tasks','Calendar'];const subjects=['Specialist Maths','Methods','Chemistry','Physics','Economics'];const types={VR:['General VR','True / False / Can’t Tell','Other VR'],DM:['General DM','Syllogisms','Logic Puzzles','Interpreting Information','Probability','Venn Diagrams','Arguments'],QR:['General QR']};
const storeKey='studyos-preview-v1';const empty=()=>({sessions:[],errors:[],homework:[],tasks:[],events:[]});let data=empty();let page='Dashboard';const $=id=>document.getElementById(id);
let client=null, user=null, loaded=false, saveQueue=Promise.resolve();
const message=t=>{$('status').textContent=t};
function save(){if(!user||!loaded)return;const owner=user.id;const snapshot=JSON.parse(JSON.stringify(data));message('Saving changes…');saveQueue=saveQueue.catch(()=>{}).then(async()=>{if(!user||user.id!==owner)return;const {error}=await client.from('studyos_data').upsert({user_id:owner,content:snapshot,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;message('Synced to cloud ✓')}).catch(e=>{message('Sync failed — '+e.message+'. Keep this page open and retry after checking your connection.');throw e});}
async function loadCloud(){loaded=false;message('Loading your private StudyOS data…');const {data:row,error}=await client.from('studyos_data').select('content').eq('user_id',user.id).maybeSingle();if(error){message('Cannot load cloud data: '+error.message);return;}data=empty();if(row?.content){for(const k of Object.keys(data))if(Array.isArray(row.content[k]))data[k]=row.content[k];}loaded=true;$('authPanel').classList.add('hide');$('accountPanel').classList.remove('hide');$('privateApp').classList.remove('hide');$('accountEmail').textContent=user.email;message('Connected — your changes sync to Supabase');render();}
async function setSession(session){const next=session?.user||null;if(next?.id===user?.id&&loaded)return;user=next;loaded=false;$('privateApp').classList.add('hide');$('accountPanel').classList.add('hide');$('authPanel').classList.toggle('hide',!!user);if(user)await loadCloud();else message('Sign in to access your private study records.');}
async function startCloud(){if(!window.STUDYOS_CONFIG?.url||!window.STUDYOS_CONFIG?.publishableKey||window.STUDYOS_CONFIG.url.includes('YOUR_')){message('Setup needed: edit config.js with your Supabase project URL and publishable key.');return;}if(!window.supabase?.createClient){message('Could not load Supabase library. Check your connection.');return;}client=window.supabase.createClient(window.STUDYOS_CONFIG.url,window.STUDYOS_CONFIG.publishableKey);$('loginForm').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim();$('authMessage').textContent='Sending sign-in email…';const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});$('authMessage').textContent=error?error.message:'Check your email and open the sign-in link on this device.'};$('signOut').onclick=async()=>{await saveQueue.catch(()=>{});await client.auth.signOut();await setSession(null)};$('importLocal').onclick=()=>{let old;try{old=JSON.parse(localStorage.getItem(storeKey)||'null')}catch{}if(!old){alert('No previous browser-only records found on this device.');return;}if(!confirm('Import old browser records into your cloud account? This adds records to your current cloud data.'))return;for(const k of Object.keys(data)){const seen=new Set(data[k].map(x=>x.id));for(const item of old[k]||[])if(!seen.has(item.id)){data[k].push(item);seen.add(item.id)}}save();render();};const {data:authData,error}=await client.auth.getSession();if(error)message('Authentication error: '+error.message);else await setSession(authData.session);client.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>{void setSession(session)},0)});}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const opt=(items)=>items.map(x=>`<option>${esc(x)}</option>`).join('');const today=()=>new Date().toLocaleDateString('en-CA');const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function render(){ $('nav').innerHTML=sections.map(s=>`<button class="${s===page?'active':'secondary'}" data-page="${s}">${s}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('app').innerHTML=({Dashboard:dashboard,'UCAT Practice':ucat,'Error Patterns':errors,Homework:homework,Tasks:tasks,Calendar:calendar})[page]();bind()}
function accuracy(section){let a=data.sessions.filter(x=>x.section===section),correct=a.reduce((n,x)=>n+Number(x.correct),0),total=a.reduce((n,x)=>n+Number(x.attempted),0);return total?`${Math.round(correct/total*100)}% (${correct}/${total})`:'No sessions yet'}
function dashboard(){return `<div class="grid">${['VR','DM','QR'].map(s=>`<div class="panel"><div class="muted">${s} accuracy</div><div class="metric">${accuracy(s)}</div></div>`).join('')}</div><div class="grid"><div class="panel"><h2>UCAT practice</h2><div class="metric">${data.sessions.length}</div><p class="muted">Sessions logged</p><button data-go="UCAT Practice">Log practice</button></div><div class="panel"><h2>Outstanding tasks</h2><div class="metric">${data.tasks.filter(t=>!t.done).length+data.homework.filter(t=>!t.done).length}</div><p class="muted">Tasks + homework</p><button data-go="Tasks">Open tasks</button></div><div class="panel"><h2>Upcoming events</h2>${data.events.filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4).map(e=>`<p>${esc(e.date)} — ${esc(e.title)}</p>`).join('')||'<p class="muted">No upcoming events</p>'}<button data-go="Calendar">Open calendar</button></div></div>`}
function ucat(){return `<div class="panel"><h2>Log UCAT practice</h2><form id="sessionForm"><div class="grid"><label>Date<input name="date" type="date" value="${today()}" required></label><label>Section<select name="section" id="ucatSection">${opt(['VR','DM','QR'])}</select></label><label>Practice type<select name="type" id="ucatType"></select></label><label>Minutes<input name="minutes" type="number" min="1" required></label><label>Questions attempted<input name="attempted" type="number" min="1" required></label><label>Questions correct<input name="correct" type="number" min="0" required></label></div><label>Source / resource<input name="source" placeholder="Question bank, mock, etc."></label><label>Brief review<textarea name="review" placeholder="What went well? What needs work?"></textarea></label><label>Next adjustment<textarea name="next" placeholder="What will you change next session?"></textarea></label><button type="submit">Save session</button></form></div><div class="panel"><h2>Practice history</h2>${data.sessions.slice().reverse().map(s=>`<div class="item"><div class="row"><strong>${esc(s.date)} · ${esc(s.section)} · ${esc(s.type)}</strong><button class="secondary" data-del="sessions:${s.id}">Delete</button></div><p>${s.correct}/${s.attempted} correct · ${s.minutes} min ${s.source?'· '+esc(s.source):''}</p>${s.review?`<p>${esc(s.review)}</p>`:''}${s.next?`<p class="muted">Next: ${esc(s.next)}</p>`:''}</div>`).join('')||'<p class="muted">No sessions logged.</p>'}</div>`}
function errors(){return `<div class="panel"><h2>Error patterns</h2><p class="muted">Categorise errors by section, with optional question-type detail.</p><form id="errorForm"><div class="grid"><label>Section<select name="section" id="errorSection">${opt(['VR','DM','QR'])}</select></label><label>Question type (optional)<select name="type" id="errorType"></select></label></div><label>Mistake pattern<input name="pattern" required placeholder="e.g. misreading conditions"></label><label>Likely cause<textarea name="cause"></textarea></label><label>Adjustment for next time<textarea name="fix"></textarea></label><button type="submit">Save pattern</button></form></div>${['VR','DM','QR'].map(sec=>`<div class="panel"><h2>${sec} patterns</h2>${data.errors.filter(e=>e.section===sec).map(e=>`<div class="item"><div class="row"><strong>${esc(e.pattern)}</strong><button class="secondary" data-del="errors:${e.id}">Delete</button></div><span class="tag">${esc(e.type)}</span><p>${esc(e.cause)}</p><p class="muted">Adjustment: ${esc(e.fix)}</p></div>`).join('')||'<p class="muted">No patterns recorded.</p>'}</div>`).join('')}`}
function homework(){return `<div class="panel"><h2>Weekly homework & revision</h2><form id="homeworkForm"><div class="grid"><label>Subject<select name="subject">${opt(subjects)}</select></label><label>Activity<select name="kind">${opt(['Homework','Notes','Revision','Practice paper','Other'])}</select></label><label>Due date<input name="due" type="date"></label></div><label>Task<input name="title" required placeholder="e.g. Complete integration questions"></label><button type="submit">Add homework</button></form></div>${subjects.map(s=>`<div class="panel"><h2>${s}</h2>${data.homework.filter(x=>x.subject===s).map(x=>taskItem(x,'homework')).join('')||'<p class="muted">Nothing logged.</p>'}</div>`).join('')}`}
function tasks(){return `<div class="panel"><h2>To-do list</h2><form id="taskForm"><label>Task<input name="title" required placeholder="What needs doing?"></label><div class="grid"><label>Category<select name="subject">${opt([...subjects,'UCAT','Personal'])}</select></label><label>Due date<input name="due" type="date"></label></div><button type="submit">Add task</button></form></div><div class="panel"><h2>Open tasks</h2>${data.tasks.filter(x=>!x.done).map(x=>taskItem(x,'tasks')).join('')||'<p class="muted">No open tasks.</p>'}</div><div class="panel"><h2>Completed</h2>${data.tasks.filter(x=>x.done).map(x=>taskItem(x,'tasks')).join('')||'<p class="muted">None yet.</p>'}</div>`}
function taskItem(x,key){return `<div class="item"><div class="row"><label style="font-weight:400"><input style="width:auto;margin-right:8px" type="checkbox" data-check="${key}:${x.id}" ${x.done?'checked':''}><span style="${x.done?'text-decoration:line-through':''}">${esc(x.title)}</span></label><button class="secondary" data-del="${key}:${x.id}">Delete</button></div><div class="muted">${esc(x.subject)} ${x.kind?'· '+esc(x.kind):''} ${x.due?'· Due '+esc(x.due):''}</div></div>`}
function calendar(){let list=data.events.slice().sort((a,b)=>a.date.localeCompare(b.date));return `<div class="panel"><h2>Calendar events</h2><form id="eventForm"><label>Event<input name="title" required placeholder="Exam, deadline, work shift, social event..."></label><div class="grid"><label>Date<input name="date" type="date" required></label><label>Category<select name="kind">${opt(['School deadline','Exam','Work','Personal','Social','Other'])}</select></label><label>Time (optional)<input name="time" type="time"></label></div><button type="submit">Add event</button></form></div><div class="panel"><h2>Event list</h2>${list.map(e=>`<div class="item"><div class="row"><strong>${esc(e.date)} ${esc(e.time||'')} · ${esc(e.title)}</strong><button class="secondary" data-del="events:${e.id}">Delete</button></div><span class="tag">${esc(e.kind)}</span></div>`).join('')||'<p class="muted">No events yet.</p>'}</div>`}
function fillType(sectionId,typeId,blank){let s=$(sectionId),t=$(typeId);if(!s||!t)return;const update=()=>{t.innerHTML=(blank?'<option value="">Not specified</option>':'')+opt(types[s.value]);};s.onchange=update;update()}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});fillType('ucatSection','ucatType',false);fillType('errorSection','errorType',true);for(const [form,key] of [['sessionForm','sessions'],['errorForm','errors'],['homeworkForm','homework'],['taskForm','tasks'],['eventForm','events']]){let f=$(form);if(!f)continue;f.onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(f).entries());if(key==='sessions'){obj.attempted=Number(obj.attempted);obj.correct=Number(obj.correct);obj.minutes=Number(obj.minutes);if(obj.correct>obj.attempted){alert('Correct answers cannot exceed attempted questions.');return}}if(key==='tasks'||key==='homework')obj.done=false;obj.id=uid();data[key].push(obj);save();render()}}document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this record?'))return;let[k,id]=b.dataset.del.split(':');data[k]=data[k].filter(x=>x.id!==id);save();render()});document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{let[k,id]=c.dataset.check.split(':');let item=data[k].find(x=>x.id===id);if(item){item.done=c.checked;save();render()}})}startCloud();
</script></body></html>
